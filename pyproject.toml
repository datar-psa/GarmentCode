[build-system]
requires = ['setuptools>=42']
build-backend = 'setuptools.build_meta'

[project]
name = "pygarment"
version = "2.0.2"
description = "A modular programming framework for designing parametric sewing patterns"
readme = "ReadMe.md"
requires-python = ">=3.6"
dependencies = [
    "pyyaml>=6.0",
    "numpy<2",
    "scipy",
    "svgwrite",
    "svgpathtools",
    "psutil",
    "matplotlib",
    "CairoSVG",
    "nicegui",
    "trimesh",
    "libigl",
    "pyrender",
    "cgal",
]

[project.optional-dependencies]
viz = []
sim = []

[tool.setuptools]
package-dir = {"" = "pygarment"}

[tool.setuptools.packages.find]
where = ["pygarment"]
